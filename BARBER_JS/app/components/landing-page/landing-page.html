<!DOCTYPE html>
<html lang="en" ng-app="barberApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbershop App</title>
    <link rel="stylesheet" href="./landing-page.css"/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body >
    <header class="underline-border pb-2" ng-controller="IndexController">
        <div class="navbar">
            <!-- Left Column: Logo -->
            <div class="logo-section">
                <div class="image-wrapper mb-1 me-2">
                    <img class="image-content" src="./content/clip 3.png" />
                </div>
                <a class="logo-link" href="#">{{title}}</a>
            </div>

            <!-- Center Column: Navigation -->
            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#team">Team</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>

            <!-- Right Column: Action Buttons -->
            <div class="action-buttons">
                <a href="#login" class="btn btn-login">Login</a>
                <a href="#book" class="btn btn-book">Book Now</a>
            </div>
        </div>
    </header>

    <section id="about" class="panel">about</section>
    <section id="services" class="panel">services</section>
    <section id="team" class="panel">team</section>
    <section id="contact" class="panel">Contact</section>

    
    <script src="./index.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
</body>
</html>
