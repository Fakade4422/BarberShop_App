<!DOCTYPE html>
<html lang="en" ng-app="barberApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbershop App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <link rel="stylesheet" href="./styles.css">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>

<body>
    <div class="container mt-5 text-center h-100">
        <div class="row justify-content-center" ng-controller="IndexController">
            <h1 style="color: rgb(249, 209, 10); font-weight: bold;">{{message | uppercase}}</h1>
            <div class="image-wrapper border p-5 shadow rounded">
                <img class="image-content" src={{imageSrc}} />
            </div>

            <div class="d-flex justify-content-center mt-4">
                <button class="btn btn-md btn-primary w-75 fw-bold fs-5">
                    {{loginPage}}
                </button>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
    <script src="./index.js"></script>

</body>
</html>
