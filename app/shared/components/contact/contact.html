<div class="row text-center">
    <span class="contact-heading h-100">CONTACT US</span>
</div>
<div class="row mx-0 p-0 h-100 mt-3">
    <div class="col-md-6 col-12 mx-0 d-flex justify-content-center">
        <section id="img-contact" class="w-75"></section>
    </div>

    <div class="col-md-6 col-12 mx-0 p-0 d-flex justify-content-center">
        <div class="form-wrapper p-2">
            <form method="post" enctype="multipart/form-data" class="container">
                <div class="pb-3">
                    <div class="row mb-3 mt-2">
                        <h1 class="text-center fw-bold" style="color: #fcc914;">LET'S WORK</h1>
                        <span class="ps-4 d-flex text-center fw-bold" style="color: #8c8c8c;">
                            Send us a message if you have any questions or inquiries. We are here to assist you and provide the information you need.
                        </span>
                    </div>

                    <div class="row mb-1 ps-4">
                        <div class="col-6 ps-3">
                            <input class="inputText text-center form-control" type="text" placeholder="Firstname" required>
                        </div>
                        <div class="col-6 ps-1">
                            <input class="inputText text-center form-control" placeholder="Surname" type="text" required>
                        </div>
                    </div>

                    <div class="row mb-1 ps-4">
                        <div class="ps-3 w-100">
                            <input class="inputText form-control form-control" type="email" placeholder="Email Address" required>
                        </div>
                    </div>

                    <div class="row mb-1 ps-4 ">
                        <div class="ps-3 w-100 textarea-wrapper">
                            <textarea class="form-control h-100" placeholder="Message"></textarea>
                        </div>
                    </div>

                    <div class="row ps-4 mt-3">
                        <div class="ps-3 w-100 d-flex justify-content-center">
                            <button class="btn-contact py-2 px-3 w-100" type="submit">Send Message <i class="send_icon bi bi-cursor"></i></button>
                        </div>
                    </div>

                    <div class="row ps-4 pt-3 ">
                        <span class="ms-1 " id="errorMessage">
                            * Email must end with "@gmail.com"<br>
                            * Fill in the provided fields to submit your message
                        </span>
                    </div>
                </div>

            </form>
        </div>
    </div>
</div>
